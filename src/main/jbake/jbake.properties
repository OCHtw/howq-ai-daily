site.host=https://ochtw.github.io/howq-ai-daily
site.title=howq AI Daily
site.subtitle=Build in open · AI × 餐飲微小店家
site.description=把 AI 帶進餐飲微小店家的工程日誌：產品、資料、AI、Open Data 與真實開發紀錄。
site.author=OCHtw

# render.tags=false
render.sitemap=false
render.archive=false
render.feed=false

server.hostname=localhost
server.port=8820
server.contextPath=/

default.status=published
default.type=page
markdown.extensions=HARDWRAPS,AUTOLINKS,FENCED_CODE_BLOCKS,TABLES

# --------------------------------------------------
# Tags
# --------------------------------------------------

render.tags=true
render.tagsindex=true

template.tag.file=tags.ftl
template.tagsindex.file=tagsindex.ftl

tag.path=tags
tag.sanitize=true


# --------------------------------------------------
# Search index  JBake 會自動為每個 tag 產生頁面，例如 tags/AI.html，也可以建立 tags/index.html
# --------------------------------------------------

template.search.file=search.ftl
template.search.extension=.json
