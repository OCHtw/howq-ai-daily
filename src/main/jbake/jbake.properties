site.host=https://dev.howqpon.com/
site.title=howq AI Daily
site.subtitle=Build in open · AI × 餐飲微小店家
site.description=把 AI 帶進餐飲微小店家的工程日誌：產品、資料、AI、Open Data 與真實開發紀錄。

# --------------------------------------------------
# Author identity (shared across this blog's posts and news commentary)
# --------------------------------------------------
# Author's visible name (JSON-LD Person.name and HTML byline).
site.author=OCHtw
# Stable Person identity: reuse this same URI on other blogs by the same author.
# The ochtw.com domain is owned but currently has no live author page.
site.author.id=https://ochtw.com/#person
# JSON-LD Person.url: canonical public profile page for the author.
# Does NOT control the visible article author link.
site.author.url=https://dev.howqpon.com/about.html
# HTML article byline only: where clicking "OCHtw" takes the reader.
# Independent of site.author.url above.
site.author.display.url=https://dev.howqpon.com/about.html
# Other pages that unambiguously identify the same author.
# Multiple URLs: separate with semicolons (;). Empty = omit sameAs.
site.author.sameas=https://github.com/OCHtw

# render.tags=false
render.sitemap=true
render.archive=false
render.feed=false

server.hostname=localhost
server.port=8820
server.contextPath=/

default.status=published
default.type=page
markdown.extensions=HARDWRAPS,AUTOLINKS,FENCED_CODE_BLOCKS,TABLES

# --------------------------------------------------
# Custom content types
# --------------------------------------------------

template.news.file=news.ftl
template.newsindex.file=news-index.ftl

# Build /llms.txt with JBake and FreeMarker; no Maven plugin changes needed.
template.llms.file=llms.ftl
template.llms.extension=.txt

# --------------------------------------------------
# Tags
# --------------------------------------------------

render.tags=true
render.tagsindex=true

template.tag.file=tags.ftl
template.tagsindex.file=tagsindex.ftl

tag.path=tags
tag.sanitize=true


# --------------------------------------------------
# Search index
# --------------------------------------------------

template.search.file=search.ftl
template.search.extension=.json
template.sitemap.file=sitemap.ftl
site.publisher=howq AI Daily

# --------------------------------------------------
# Outbound links on news pages
# --------------------------------------------------
news.utm.enabled=true
news.utm.source=howqpon.com
news.utm.medium=referral
news.utm.campaign=blog_news

# Optional: do not append UTM to news links from these domains.
# Use semicolons (;) to separate hostnames. No https:// or path.
# Includes each listed domain and its subdomains; empty = exclude none.
# Example: news.utm.exclude_domains=example.com;another-news.org
news.utm.exclude_domains=
